<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 - Product Review Form</title>
    <meta name="description" content="Product Review Form for WDD 131">
    <meta name="author" content="Alberto F. Conejo">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
    <script src="scripts/getdates.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review Form</h1>
    </header>
    <main>
        <form action="review.html" method="get" class="wf1">
            <label for="product-name">Product Name</label>
            <select id="product-name" name="product" required>
                <option value="" disabled selected>Choose a Product...</option>
            </select>
            <fieldset class="form-group">
                <legend>Overall Rating</legend>
                <div class="rating-box">
                    <p class="clasificacion">
                        <input id="star1" type="radio" name="rating" value="1" required>
                        <label for="star1">&#9733;</label>
                        
                        <input id="star2" type="radio" name="rating" value="2" required>
                        <label for="star2">&#9733;</label>
                        
                        <input id="star3" type="radio" name="rating" value="3" required>
                        <label for="star3">&#9733;</label>
                        
                        <input id="star4" type="radio" name="rating" value="4" required>
                        <label for="star4">&#9733;</label>
                        
                        <input id="star5" type="radio" name="rating" value="5" required>
                        <label for="star5">&#9733;</label>
                    </p>
                </div>
            </fieldset>
            <label for="install-date">Date of Installation</label>
            <input type="date" id="install-date" name="install-date" required>
            <fieldset class="features-box">
                <legend>Which features did you find useful in the product?</legend>
                <div class="features-grid">
                    <label><input type="checkbox" name="durability" value="yes"> Durability</label>
                    <label><input type="checkbox" name="easy-to-use" value="yes">Easy to use</label>
                    <label><input type="checkbox" name="performance" value="yes">Performance</label>
                    <label><input type="checkbox" name="design" value="yes">Design</label>
                </div>
            </fieldset>
            <label for="comments">Written Review <span class="optional">(Optional)</span></label>
            <textarea id="comments" name="comments" rows="5" placeholder="Write your review here..."></textarea>
            <label for="user-name">Your Name <span class="optional">(Optional)</span></label>
            <input type="text" id="user-name" name="user-name" placeholder="Enter your name">
            <input type="submit" value="Post Review">
        </form>
    </main>
    <footer>
        <p>&copy; <span id="currentyear"></span> | Alberto F. Conejo | Barcelona, Spain</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
