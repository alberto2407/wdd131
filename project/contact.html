<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - The Restored Gospel</title>
    <meta name="description" content="Contact us to learn more about the Restoration of the Gospel of Jesus Christ. We would love to hear from you.">
    <meta name="author" content="Alberto F. Conejo">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400;1,700&family=Lora:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="images/temple.ico">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/large.css">
    <script src="scripts/index.js" defer></script>
    <script src="scripts/contact.js" defer></script>
    <script src="../scripts/getdates.js" defer></script>
  </head>
  <body>
    <header>
      <div class="header-content">
        <a href="index.html">
          <img class="logo" src="images/temple-logo.webp" alt="Church Logo" loading="lazy">
        </a>
        <h1 class="title-header">The Restored Gospel</h1>
        <button id="menu" aria-label="Toggle navigation menu"></button>
        <nav class="navigation">
          <a href="index.html">Home</a>
          <a href="services.html">Services</a>
          <a href="contact.html" class="active">Contact</a>
        </nav>
      </div>
    </header>
    <main>
      <section class="contact-page">
        <h2>Contact Us</h2>
        <p class="contact-intro">
          We would love to hear from you! Fill out the form below and we will
          get back to you as soon as possible.
        </p>
        <form id="contactForm" action="thanks.html" method="get" class="contact-form">
          <div class="form-group">
            <label for="contact-name">Full Name <span class="required">*</span></label>
            <input type="text" id="contact-name" name="name" placeholder="Enter your full name" required>
          </div>
          <div class="form-group">
            <label for="contact-email">Email Address <span class="required">*</span></label>
            <input type="email" id="contact-email" name="email" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label for="contact-phone">Phone Number <span class="optional">(Optional)</span></label>
            <input type="tel" id="contact-phone" name="phone" placeholder="(123) 456-7890">
          </div>
          <div class="form-group">
            <label for="contact-interest">What are you interested in?<span class="required">*</span></label>
            <select id="contact-interest" name="interest" required>
              <option value="" disabled selected>Select an option...</option>
              <option value="first-vision">The First Vision</option>
              <option value="book-of-mormon">The Book of Mormon</option>
              <option value="prophets">Prophets and Revelation</option>
              <option value="prayer">Prayer</option>
              <option value="bible">The Bible</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="contact-message">Message <span class="required">*</span></label>
            <textarea id="contact-message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
          </div>
          <div class="form-group">
            <label>Preferred Contact Method</label>
            <div class="radio-group">
              <label><input type="radio" name="contact-method" value="email" checked>Email</label>
              <label><input type="radio" name="contact-method" value="phone"> Phone</label>
              <label><input type="radio" name="contact-method" value="text"> Text Message</label>
              <label><input type="radio" name="contact-method" value="in-person"> In-Person</label>
            </div>
          </div>
          <button type="submit" class="submit-btn">Send Message</button>
        </form>
      </section>
    </main>
    <footer>
      <p>&copy; <span id="currentyear"></span> | Alberto F. Conejo | Barcelona, Spain</p>
      <p id="lastModified"></p>
    </footer>
  </body>
</html>
