<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 - Responsive Images</title>
    <meta name="description" content="WDD 131 – Dynamic Web Fundamentals - Responsive images activity for WDD 131">
    <meta name="author" content="Alberto F. Conejo">
    <link rel="stylesheet" href="styles/responsive-images.css">
</head>
<body>
    <div class="hero">
        <picture>
            <source media="(min-width: 1000px)" srcset="images/hero-large.webp">
            <source media="(min-width: 500px)" srcset="images/hero-medium.webp">
            <img src="images/hero-small.webp" alt="Hero Image" alt="Madrid, Spain Temple" width="500" height="250">
        </picture>
    </div>
</body>
</html>
